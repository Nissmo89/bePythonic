[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "bePythonic"
version = "0.1.0"
description = "Fresh desktop GUI starter built with PyQt6 and QWebEngine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "bePythonic Contributors" }
]
keywords = ["python", "gui", "pyqt", "desktop", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Software Development :: User Interfaces"
]
dependencies = [
  "PyQt6>=6.7.1",
  "PyQt6-WebEngine>=6.7.0",
  "PyQt6-Frameless-Window>=0.8.1"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11.0"
]

[project.scripts]
bepythonic = "bepythonic.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bepythonic"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["closeEvent"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"

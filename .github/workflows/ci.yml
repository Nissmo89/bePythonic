name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check . --per-file-ignores "src/bepythonic/gui/main_window.py:N802,RUF100"
      - name: Type-check
        run: mypy src
      - name: Build Smoke Check
        run: python -m compileall src
